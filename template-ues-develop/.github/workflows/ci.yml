name: 🚀 CI/CD Pipeline & GHCR Publish

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-validate:
    name: 🔍 Lint & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Run linters / formatting checks
        run: |
          echo "Validando sintaxis y formato..."

  build-and-publish:
    name: 🐳 Build & Publish OCI Image
    needs: lint-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Requerido para publicar en GHCR

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # develop genera el tag :staging y :develop
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            # main genera el tag :latest y el hash corto de git
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Inicia sesión en GHCR solo si es un push (no en PRs externos/abiertos)
      - name: 🔐 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ hashFiles('Containerfile') != '' && 'Containerfile' || 'Dockerfile' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
