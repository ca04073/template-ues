services:
  app:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-{{PROJECT_NAME}}}:${IMAGE_TAG:-staging}
    container_name: ${CONTAINER_NAME:-{{PROJECT_NAME}}-app}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER_PORT: ${CONTAINER_PORT:-{{CONTAINER_PORT}}}
    ports:
      - "${HOST_IP:-127.0.0.1}:${HOST_PORT:-{{HOST_PORT}}}:${CONTAINER_PORT:-{{CONTAINER_PORT}}}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${CONTAINER_PORT:-{{CONTAINER_PORT}}}
