# ====================================================================
# 🚀 CI/CD PIPELINE & GHCR PUBLISH
# Ubicación: .github/workflows/ci.yml
# ====================================================================
name: 🚀 CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: 🔍 Lint, Security & Code Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧪 Run base repository validation
        run: |
          echo "Ejecutando verificaciones sintácticas y de consistencia base..."
          test -f compose.yaml || { echo "ERROR: compose.yaml no encontrado"; exit 1; }
          (test -f Dockerfile || test -f Containerfile) || { echo "ERROR: No se encontró Dockerfile o Containerfile"; exit 1; }
          echo "✅ Archivos estructurales verificados correctamente."

  build-and-publish:
    name: 🐳 Build & Publish OCI Image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. Pull Requests -> Tag efímero local para validar la compilación
            type=ref,event=pr,prefix=pr-

            # 2. Rama develop -> Imagen de staging para pruebas e integración
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/develop' }}

            # 3. Rama main -> Versión productiva general
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # 4. Tags Git (SemVer) -> Versiones formales de release
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ hashFiles('Containerfile') != '' && 'Containerfile' || 'Dockerfile' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max